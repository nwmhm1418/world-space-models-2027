
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>World Championship for Space Models 2027</title>

  <style>
    :root {
      --navy: #102b49;
      --navy-dark: #0b2038;
      --blue: #315b80;
      --white: #ffffff;
      --light: #f3f5f7;
      --text: #172b3d;
      --muted: #5d6c7a;
      --border: #dce2e8;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      color: var(--text);
      background: var(--light);
    }

    /* Górny pasek */

    header {
      min-height: 88px;
      padding: 14px 4%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      background: var(--navy-dark);
      border-bottom: 4px solid var(--blue);
      flex-wrap: wrap;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      color: var(--white);
      text-decoration: none;
      flex-shrink: 0;
    }

    .brand img {
      width: 50px;
      height: 50px;
      object-fit: contain;
    }

    .brand-name {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 1px;
    }

    .brand-year {
      color: #b9d0e5;
      font-weight: 400;
    }

    nav {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 19px;
      flex-wrap: wrap;
    }

    nav a {
      padding: 8px 0;
      color: #e0e8f0;
      text-decoration: none;
      font-size: 13px;
      transition: color 0.2s;
    }

    nav a:hover,
    nav a.active {
      color: #a9c9e6;
      border-bottom: 2px solid #a9c9e6;
    }

    .language {
      display: flex;
      gap: 5px;
      flex-shrink: 0;
    }

    .language button {
      padding: 7px 9px;
      color: #e0e8f0;
      background: transparent;
      border: 1px solid #63778c;
      border-radius: 3px;
      cursor: pointer;
      font-size: 12px;
    }

    .language button.active,
    .language button:hover {
      color: var(--navy-dark);
      background: var(--white);
      border-color: var(--white);
    }

    /* Główne zdjęcie i jasny panel */

    .hero {
      min-height: 690px;
      padding: 65px 5%;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;

      background-image:
        linear-gradient(
          rgba(10, 28, 47, 0.35),
          rgba(10, 28, 47, 0.35)
        ),
        url("tlohome.jpg");

      background-position: center;
      background-size: cover;
      background-repeat: no-repeat;
    }

    .hero-panel {
      width: min(900px, 100%);
      padding: 65px 55px;
      text-align: center;
      background: rgba(255, 255, 255, 0.96);
      border-top: 6px solid var(--navy);
      box-shadow: 0 8px 35px rgba(0, 0, 0, 0.18);
    }

    .event-label {
      margin: 0 0 22px;
      color: var(--blue);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 2px;
      line-height: 1.7;
      text-transform: uppercase;
    }

    h1 {
      max-width: 780px;
      margin: 0 auto;
      color: var(--navy);
      font-size: clamp(34px, 5vw, 60px);
      font-weight: 700;
      line-height: 1.12;
    }

    .title-divider {
      width: 75px;
      height: 3px;
      margin: 28px auto;
      background: var(--blue);
    }

    .event-date {
      margin: 0;
      color: var(--muted);
      font-size: 18px;
      letter-spacing: 1px;
    }

    /* Stopka */

    footer {
      padding: 23px 5%;
      color: #d5dee7;
      background: var(--navy-dark);
      text-align: center;
      font-size: 12px;
    }

    /* Urządzenia mobilne */

    @media (max-width: 1100px) {
      header {
        justify-content: center;
      }

      nav {
        order: 3;
        width: 100%;
        gap: 16px;
      }
    }

    @media (max-width: 600px) {
      header {
        padding: 15px 4%;
        gap: 15px;
      }

      nav {
        gap: 8px 14px;
      }

      nav a {
        font-size: 12px;
      }

      .hero {
        min-height: 580px;
        padding: 35px 5%;
      }

      .hero-panel {
        padding: 45px 22px;
      }

      .event-label {
        font-size: 11px;
        letter-spacing: 1.5px;
      }

      h1 {
        font-size: clamp(32px, 8vw, 44px);
      }

      .event-date {
        font-size: 16px;
      }
    }
  </style>
</head>

<body>

  <header>
    <a class="brand" href="index.html">
      <img src="images/logo.png" alt="Championship logo">
      <span class="brand-name">
        WCSM <span class="brand-year">2027</span>
      </span>
    </a>

    <nav>
      <a href="index.html" class="active"
         data-en="Home" data-pl="Strona główna">Home</a>

      <a href="bulletins.html"
         data-en="Bulletins" data-pl="Biuletyny">Bulletins</a>

      <a href="general.html"
         data-en="General" data-pl="Ogólne">General</a>

      <a href="results.html"
         data-en="Results" data-pl="Wyniki">Results</a>

      <a href="information.html"
         data-en="Information" data-pl="Informacje">Information</a>

      <a href="registration.html"
         data-en="Registration" data-pl="Rejestracja">Registration</a>

      <a href="gallery.html"
         data-en="Photo Gallery" data-pl="Galeria zdjęć">Photo Gallery</a>
    </nav>

    <div class="language">
      <button type="button" id="enBtn" onclick="setLanguage('en')">EN</button>
      <button type="button" id="plBtn" onclick="setLanguage('pl')">PL</button>
    </div>
  </header>

  <main>
    <section class="hero">
      <div class="hero-panel">

        <p class="event-label"
           data-en="Official Championship · 2027"
           data-pl="Oficjalne Mistrzostwa · 2027">
          Official Championship · 2027
        </p>

        <h1
          data-en="World Championship for Space Models"
          data-pl="Mistrzostwa Świata Modeli Kosmicznych">
          World Championship for Space Models
        </h1>

        <div class="title-divider"></div>

        <p class="event-date"
           data-en="xx–xx month 2027"
           data-pl="xx–xx miesiąc 2027">
          xx–xx month 2027
        </p>

      </div>
    </section>
  </main>

  <footer>
    © 2027 World Championship for Space Models
  </footer>

  <script>
    function setLanguage(lang) {
      document.documentElement.lang = lang;
      localStorage.setItem('wcsm-language', lang);

      document.querySelectorAll('[data-en][data-pl]').forEach(element => {
        element.textContent = element.dataset[lang];
      });

      document.getElementById('enBtn')
        .classList.toggle('active', lang === 'en');

      document.getElementById('plBtn')
        .classList.toggle('active', lang === 'pl');
    }

    setLanguage(localStorage.getItem('wcsm-language') || 'en');
  </script>

</body>
</html>
