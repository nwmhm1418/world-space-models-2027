
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>World Championship for Space Models 2027</title>

  <style>
    :root {
      --navy: #07172e;
      --header: #051227;
      --sky: #83d4ff;
      --text: #f7faff;
      --muted: #d5e2f1;
      --border: rgba(255,255,255,.16);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      color: var(--text);
      background: var(--navy);
    }

    header {
      position: relative;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      padding: 18px 5%;
      background: var(--header);
      border-bottom: 1px solid var(--border);
      flex-wrap: wrap;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      color: white;
      text-decoration: none;
      font-weight: bold;
      letter-spacing: 1px;
    }

    .brand img {
      width: 48px;
      height: 48px;
      object-fit: contain;
    }

    .brand span {
      font-size: 20px;
    }

    nav {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 20px;
      flex-wrap: wrap;
    }

    nav a {
      color: var(--muted);
      text-decoration: none;
      font-size: 14px;
      transition: color .2s;
    }

    nav a:hover,
    nav a.active {
      color: var(--sky);
    }

    .language {
      display: flex;
      gap: 6px;
    }

    .language button {
      padding: 7px 10px;
      color: var(--muted);
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 6px;
      cursor: pointer;
    }

    .language button.active,
    .language button:hover {
      color: var(--navy);
      background: var(--sky);
    }

    .hero {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: calc(100vh - 85px);
      padding: 80px 6%;
      text-align: center;
      background:
        linear-gradient(
          rgba(3, 14, 31, .48),
          rgba(3, 14, 31, .72)
        ),
        url("tlohome.jpg") center center / cover no-repeat;
    }

    .hero-content {
      position: relative;
      z-index: 1;
      width: min(100%, 1000px);
    }

    .eyebrow {
      margin-bottom: 22px;
      color: var(--sky);
      font-size: 14px;
      font-weight: bold;
      letter-spacing: 4px;
      text-transform: uppercase;
    }

    h1 {
      margin: 0 auto 25px;
      font-size: clamp(40px, 7vw, 82px);
      line-height: 1.08;
      text-shadow: 0 4px 20px rgba(0,0,0,.35);
    }

    .date {
      margin: 0;
      color: #e0edf9;
      font-size: clamp(17px, 2.5vw, 25px);
      letter-spacing: 2px;
    }

    footer {
      padding: 22px 5%;
      color: var(--muted);
      text-align: center;
      background: var(--header);
      border-top: 1px solid var(--border);
      font-size: 13px;
    }

    @media (max-width: 900px) {
      header {
        justify-content: center;
      }

      nav {
        order: 3;
        width: 100%;
        gap: 14px;
      }

      .hero {
        min-height: calc(100vh - 150px);
      }
    }

    @media (max-width: 500px) {
      nav a {
        font-size: 13px;
      }

      .eyebrow {
        font-size: 11px;
        letter-spacing: 2px;
      }

      .date {
        letter-spacing: 1px;
      }
    }
  </style>
</head>

<body>
  <header>
    <a class="brand" href="index.html">
      <img src="images/logo.png" alt="WCSM logo">
      <span>WCSM <span style="color:#83d4ff">2027</span></span>
    </a>

    <nav>
      <a href="index.html" class="active"
         data-en="Home" data-pl="Strona główna">Home</a>

      <a href="bulletins.html"
         data-en="Bulletins" data-pl="Biuletyny">Bulletins</a>

      <a href="general.html"
         data-en="General" data-pl="Ogólne">General</a>

      <a href="results.html"
         data-en="Results" data-pl="Wyniki">Results</a>

      <a href="information.html"
         data-en="Information" data-pl="Informacje">Information</a>

      <a href="registration.html"
         data-en="Registration" data-pl="Rejestracja">Registration</a>

      <a href="gallery.html"
         data-en="Photo Gallery" data-pl="Galeria zdjęć">Photo Gallery</a>
    </nav>

    <div class="language">
      <button type="button" id="enBtn" onclick="setLanguage('en')">EN</button>
      <button type="button" id="plBtn" onclick="setLanguage('pl')">PL</button>
    </div>
  </header>

  <main>
    <section class="hero">
      <div class="hero-content">
        <div class="eyebrow"
             data-en="World Championship 2027"
             data-pl="Mistrzostwa Świata 2027">
          World Championship 2027
        </div>

        <h1 data-en="World Championship for Space Models"
            data-pl="Mistrzostwa Świata Modeli Kosmicznych">
          World Championship for Space Models
        </h1>

        <p class="date"
           data-en="xx–xx month 2027"
           data-pl="xx–xx miesiąc 2027">
          xx–xx month 2027
        </p>
      </div>
    </section>
  </main>

  <footer>
    © 2027 World Championship for Space Models
  </footer>

  <script>
    function setLanguage(lang) {
      document.documentElement.lang = lang;
      localStorage.setItem('wcsm-language', lang);

      document.querySelectorAll('[data-en][data-pl]').forEach(element => {
        element.textContent = element.dataset[lang];
      });

      document.getElementById('enBtn').classList.toggle('active', lang === 'en');
      document.getElementById('plBtn').classList.toggle('active', lang === 'pl');
    }

    setLanguage(localStorage.getItem('wcsm-language') || 'en');
  </script>
</body>
</html>
