
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>World Championship for Space Models 2027</title>
<style>
*{box-sizing:border-box}
:root{--bg:#102B4E;--panel:#17385F;--panel2:#214B79;--gold:#E8B96D;--text:#F4F7FC;--muted:#CAD8E8;--border:rgba(255,255,255,.13)}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text)}
header{padding:18px 5%;background:#0B203B;border-bottom:1px solid var(--border)}
.header-top{display:flex;align-items:center;justify-content:space-between}
.logo{width:76px;height:76px;object-fit:contain}
.language{border:1px solid var(--border);background:var(--panel2);color:white;border-radius:12px;padding:11px 16px;cursor:pointer;font-weight:bold}
nav{display:flex;justify-content:center;align-items:center;flex-wrap:wrap;gap:7px;margin-top:20px}
nav a{color:var(--muted);text-decoration:none;padding:11px 14px;border-radius:10px;font-size:14px;transition:.2s}
nav a:hover,nav a.active{color:var(--gold);background:var(--panel2)}
main{max-width:1200px;margin:auto;padding:55px 24px 85px}
.hero{min-height:490px;padding:55px 25px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;border:1px solid var(--border);border-radius:28px;background:radial-gradient(ellipse at top right,rgba(232,185,109,.12),transparent 45%),linear-gradient(135deg,#17385F,#102B4E 70%);box-shadow:0 20px 55px rgba(0,0,0,.18)}
.eyebrow{color:var(--gold);font-size:13px;letter-spacing:3px;text-transform:uppercase;font-weight:bold;margin-bottom:24px}
h1{font-size:clamp(38px,6vw,76px);line-height:1.08;letter-spacing:-2px;margin:0;max-width:950px}
.date{font-size:clamp(18px,2.2vw,24px);color:var(--muted);margin-top:28px}
.gold-line{width:75px;height:3px;background:var(--gold);border-radius:10px;margin-top:28px}
footer{text-align:center;color:var(--muted);padding:25px;font-size:13px;border-top:1px solid var(--border)}
@media(max-width:700px){header{padding:14px 4%}.logo{width:58px;height:58px}nav{gap:4px;margin-top:14px}nav a{padding:9px 10px;font-size:13px}main{padding:30px 14px 55px}.hero{min-height:390px;border-radius:22px}h1{letter-spacing:-1px}}
</style>
</head>
<body>
<header>
  <div class="header-top">
    <a href="index.html"><img class="logo" src="images/logo.png" alt="Championship logo"></a>
    <button class="language" id="languageButton">🇵🇱 Polski</button>
  </div>
  <nav>
    <a class="active" href="index.html" data-en="Home" data-pl="Strona główna">Home</a>
    <a href="bulletins.html" data-en="Bulletins" data-pl="Biuletyny">Bulletins</a>
    <a href="general.html" data-en="General" data-pl="Ogólne">General</a>
    <a href="results.html" data-en="Results" data-pl="Wyniki">Results</a>
    <a href="information.html" data-en="Information" data-pl="Informacje">Information</a>
    <a href="registration.html" data-en="Registration" data-pl="Rejestracja">Registration</a>
    <a href="gallery.html" data-en="Photo Gallery" data-pl="Galeria zdjęć">Photo Gallery</a>
  </nav>
</header>
<main>
  <section class="hero">
    <div class="eyebrow" data-en="International Model Rocketry" data-pl="Międzynarodowe modelarstwo rakietowe">International Model Rocketry</div>
    <h1 data-en="World Championship for Space Models" data-pl="Mistrzostwa Świata Modeli Kosmicznych">World Championship for Space Models</h1>
    <div class="date" data-en="xx-xx month 2027" data-pl="xx-xx miesiąc 2027">xx-xx month 2027</div>
    <div class="gold-line"></div>
  </section>
</main>
<footer>World Championship for Space Models 2027</footer>
<script>
const languageButton=document.getElementById("languageButton");
let currentLanguage=localStorage.getItem("wcsm-language")||"en";
function setLanguage(language){
 currentLanguage=language;localStorage.setItem("wcsm-language",language);document.documentElement.lang=language;
 document.querySelectorAll("[data-en]").forEach(el=>el.textContent=el.dataset[language]);
 languageButton.textContent=language==="en"?"🇵🇱 Polski":"🇬🇧 English";
}
languageButton.addEventListener("click",()=>setLanguage(currentLanguage==="en"?"pl":"en"));
setLanguage(currentLanguage);
</script>
</body>
</html>
