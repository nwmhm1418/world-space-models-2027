
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Photo Gallery | WCSM 2027</title>
<style>
:root{--navy:#07172e;--sky:#83d4ff;--white:#f7faff;--line:rgba(255,255,255,.16)}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--navy);color:var(--white);font-family:Arial,Helvetica,sans-serif;min-height:100vh}
a{color:inherit;text-decoration:none}
header{min-height:86px;padding:10px 5%;display:flex;align-items:center;justify-content:space-between;gap:25px;background:#051227;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;flex-shrink:0}.brand img{width:62px;height:62px;object-fit:contain}.brand-text{font-size:16px;font-weight:800;letter-spacing:1.4px}.brand-text span{display:block;color:var(--sky);font-size:12px;letter-spacing:3px}
nav{display:flex;justify-content:center;gap:clamp(12px,1.8vw,28px)}nav a{font-size:12px;color:#d7e4f4;white-space:nowrap;padding:12px 0}nav a:hover,nav a.active{color:var(--sky)}nav a.active{border-bottom:3px solid var(--sky)}
.language-button{border:1px solid var(--line);border-radius:7px;padding:10px 12px;background:transparent;color:white;cursor:pointer;white-space:nowrap}
.hero{min-height:calc(78vh - 86px);display:flex;align-items:center;background:radial-gradient(ellipse at 80% 25%,#2459a6 0%,transparent 42%),linear-gradient(110deg,#07172e,#10294b);border-bottom:1px solid var(--line)}
.hero-content{padding:60px 6%;width:100%;max-width:1400px;margin:auto}
.eyebrow{color:var(--sky);font-size:12px;font-weight:bold;letter-spacing:4px;text-transform:uppercase;margin-bottom:18px}
h1{font-size:clamp(48px,8vw,90px);line-height:1;letter-spacing:-2px;text-transform:uppercase}h1 span{color:var(--sky)}
footer{padding:24px 5%;border-top:1px solid var(--line);color:#91a8c5;font-size:12px;display:flex;justify-content:space-between;gap:15px}
@media(max-width:1100px){header{flex-wrap:wrap}nav{order:3;width:100%;justify-content:flex-start;overflow-x:auto;gap:22px}}
@media(max-width:650px){.brand img{width:49px;height:49px}.hero-content{padding:45px 6%}h1{font-size:43px}footer{flex-direction:column}}
</style>
</head>
<body>
<header>
  <a class="brand" href="index.html"><img src="images/logo.png" alt="Championship logo"><div class="brand-text">WCSM<span>2027</span></div></a>
  <nav aria-label="Main navigation">
    <a href="index.html" data-en="Home" data-pl="Strona główna">Home</a>
    <a href="bulletins.html" data-en="Bulletins" data-pl="Biuletyny">Bulletins</a>
    <a href="general.html" data-en="General" data-pl="Ogólne">General</a>
    <a href="results.html" data-en="Results" data-pl="Wyniki">Results</a>
    <a href="information.html" data-en="Information" data-pl="Informacje">Information</a>
    <a href="registration.html" data-en="Registration" data-pl="Rejestracja">Registration</a>
    <a href="gallery.html" class="active" data-en="Photo Gallery" data-pl="Galeria zdjęć">Photo Gallery</a>
  </nav>
  <button class="language-button" id="languageButton">🇵🇱 Polski</button>
</header>
<main>
  <section class="hero"><div class="hero-content">
    <p class="eyebrow" data-en="World Championship for Space Models 2027" data-pl="Mistrzostwa Świata Modeli Kosmicznych 2027">World Championship for Space Models 2027</p>
    <h1><span data-en="Photo Gallery" data-pl="Galeria zdjęć">Photo Gallery</span></h1>
  </div></section>
</main>
<footer><span>© 2027 World Championship for Space Models</span><span data-en="Official championship website" data-pl="Oficjalna strona mistrzostw">Official championship website</span></footer>
<script>
const languageButton=document.getElementById("languageButton");let currentLanguage="en";
try{currentLanguage=localStorage.getItem("wcsm-language")||"en"}catch(e){}
function setLanguage(language){currentLanguage=language;document.documentElement.lang=language;document.querySelectorAll("[data-en][data-pl]").forEach(el=>el.textContent=el.dataset[language]);languageButton.textContent=language==="en"?"🇵🇱 Polski":"🇬🇧 English";try{localStorage.setItem("wcsm-language",language)}catch(e){}}
languageButton.addEventListener("click",()=>setLanguage(currentLanguage==="en"?"pl":"en"));setLanguage(currentLanguage);
</script>
</body>
</html>
