
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registration | World Championship for Space Models 2027</title>

<style>
* { box-sizing: border-box; }

:root {
    --bg: #f5f7fb;
    --text: #17243a;
    --muted: #68758a;
    --accent: #2457a7;
    --border: #e4e9f2;
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: var(--bg);
    color: var(--text);
}

header {
    background: white;
    border-bottom: 1px solid var(--border);
    padding: 18px 5%;
}

.header-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
}

.logo {
    width: 76px;
    height: 76px;
    object-fit: contain;
}

.language {
    border: 1px solid var(--border);
    background: white;
    color: var(--text);
    border-radius: 12px;
    padding: 10px 16px;
    cursor: pointer;
    font-weight: bold;
}

nav {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 20px;
}

nav a {
    text-decoration: none;
    color: var(--muted);
    padding: 11px 15px;
    border-radius: 12px;
    font-size: 14px;
    transition: 0.2s;
}

nav a:hover, nav a.active {
    color: var(--accent);
    background: #edf3ff;
}

main {
    max-width: 1150px;
    margin: auto;
    padding: 65px 24px 100px;
}

.hero {
    min-height: 350px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 40px 25px;
    background: linear-gradient(135deg, #ffffff, #eaf1fc);
    border: 1px solid var(--border);
    border-radius: 32px;
    box-shadow: 0 15px 50px rgba(30, 55, 90, 0.06);
}

h1 {
    margin: 0;
    font-size: clamp(42px, 7vw, 76px);
    letter-spacing: -2px;
}

.subtitle {
    max-width: 650px;
    color: var(--muted);
    font-size: 17px;
    line-height: 1.7;
    margin: 24px auto 0;
}

.form-button {
    display: inline-block;
    margin-top: 30px;
    padding: 15px 23px;
    background: var(--accent);
    color: white;
    text-decoration: none;
    font-weight: bold;
    border-radius: 14px;
    transition: 0.2s;
}

.form-button:hover {
    background: #194583;
    transform: translateY(-2px);
}

.note {
    color: var(--muted);
    font-size: 13px;
    margin-top: 18px;
}

footer {
    text-align: center;
    color: var(--muted);
    padding: 25px;
    font-size: 13px;
}

@media (max-width: 700px) {
    header { padding: 14px 4%; }
    .logo { width: 58px; height: 58px; }
    nav { gap: 4px; margin-top: 14px; }
    nav a { padding: 9px 10px; font-size: 13px; }
    main { padding: 35px 15px 60px; }
    .hero { min-height: 330px; border-radius: 24px; }
    h1 { letter-spacing: -1px; }
}
</style>
</head>

<body>
<header>
    <div class="header-top">
        <a href="index.html" aria-label="Home">
            <img class="logo" src="images/logo.png" alt="Championship logo">
        </a>

        <button class="language" id="languageButton" type="button">
            🇵🇱 Polski
        </button>
    </div>

    <nav>
        <a href="index.html" data-en="Home" data-pl="Strona główna">Home</a>
        <a href="bulletins.html" data-en="Bulletins" data-pl="Biuletyny">Bulletins</a>
        <a href="general.html" data-en="General" data-pl="Ogólne">General</a>
        <a href="results.html" data-en="Results" data-pl="Wyniki">Results</a>
        <a href="information.html" data-en="Information" data-pl="Informacje">Information</a>
        <a class="active" href="registration.html" data-en="Registration" data-pl="Rejestracja">Registration</a>
        <a href="gallery.html" data-en="Photo Gallery" data-pl="Galeria zdjęć">Photo Gallery</a>
    </nav>
</header>

<main>
    <section class="hero">
        <h1 data-en="Registration" data-pl="Rejestracja">Registration</h1>

        <p class="subtitle"
           data-en="Information about competitor registration and entry forms will be available here."
           data-pl="Informacje dotyczące rejestracji zawodników i formularze zgłoszeniowe będą dostępne tutaj.">
            Information about competitor registration and entry forms will be available here.
        </p>

        <a class="form-button" href="#"
           data-en="Registration form"
           data-pl="Formularz zgłoszeniowy">
            Registration form
        </a>

        <p class="note"
           data-en="The registration form link will be published soon."
           data-pl="Link do formularza zgłoszeniowego zostanie opublikowany wkrótce.">
            The registration form link will be published soon.
        </p>
    </section>
</main>

<footer>World Championship for Space Models 2027</footer>

<script>
const languageButton = document.getElementById("languageButton");
let currentLanguage = localStorage.getItem("wcsm-language") || "en";

function setLanguage(language) {
    currentLanguage = language;
    localStorage.setItem("wcsm-language", language);
    document.documentElement.lang = language;

    document.querySelectorAll("[data-en]").forEach(element => {
        element.textContent = element.dataset[language];
    });

    languageButton.textContent =
        language === "en" ? "🇵🇱 Polski" : "🇬🇧 English";
}

languageButton.addEventListener("click", () => {
    setLanguage(currentLanguage === "en" ? "pl" : "en");
});

setLanguage(currentLanguage);
</script>
</body>
</html>
