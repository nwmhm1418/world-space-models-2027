
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Information | World Championship 2027</title>
<style>
* { box-sizing: border-box; }
body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #f5f7fb;
    color: #17243a;
}
header {
    background: white;
    border-bottom: 1px solid #e4e9f2;
    padding: 18px 5%;
}
.header-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
}
.logo { width: 76px; height: 76px; object-fit: contain; }
.language {
    border: 1px solid #e4e9f2;
    background: white;
    border-radius: 12px;
    padding: 10px 16px;
    cursor: pointer;
    font-weight: bold;
}
nav {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 20px;
}
nav a {
    text-decoration: none;
    color: #68758a;
    padding: 11px 15px;
    border-radius: 12px;
    font-size: 14px;
}
nav a:hover, nav a.active {
    color: #2457a7;
    background: #edf3ff;
}
main {
    max-width: 1150px;
    margin: auto;
    padding: 65px 24px 100px;
}
.hero {
    min-height: 350px;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    background: linear-gradient(135deg, #ffffff, #eaf1fc);
    border: 1px solid #e4e9f2;
    border-radius: 32px;
    box-shadow: 0 15px 50px rgba(30,55,90,.06);
}
h1 {
    font-size: clamp(48px, 8vw, 82px);
    letter-spacing: -2px;
    margin: 0;
}
footer {
    text-align: center;
    color: #68758a;
    padding: 25px;
    font-size: 13px;
}
@media(max-width:700px) {
    header { padding: 14px 4%; }
    .logo { width: 58px; height: 58px; }
    nav { gap: 4px; margin-top: 14px; }
    nav a { padding: 9px 10px; font-size: 13px; }
    main { padding: 35px 15px 60px; }
    .hero { min-height: 300px; border-radius: 24px; }
}
</style>
</head>
<body>
<header>
    <div class="header-top">
        <a href="index.html" aria-label="Home">
            <img class="logo" src="images/logo.png" alt="Championship logo">
        </a>
        <button class="language" id="languageButton" type="button">🇵🇱 Polski</button>
    </div>
    <nav>
        <a href="index.html" data-en="Home" data-pl="Strona główna">Home</a>
        <a href="bulletins.html" data-en="Bulletins" data-pl="Biuletyny">Bulletins</a>
        <a href="general.html" data-en="General" data-pl="Ogólne">General</a>
        <a href="results.html" data-en="Results" data-pl="Wyniki">Results</a>
        <a class="active" href="information.html" data-en="Information" data-pl="Informacje">Information</a>
        <a href="registration.html" data-en="Registration" data-pl="Rejestracja">Registration</a>
        <a href="gallery.html" data-en="Photo Gallery" data-pl="Galeria zdjęć">Photo Gallery</a>
    </nav>
</header>

<main>
    <section class="hero">
        <h1 data-en="Information" data-pl="Informacje">Information</h1>
    </section>
</main>

<footer>World Championship for Space Models 2027</footer>

<script>
const languageButton = document.getElementById("languageButton");
let currentLanguage = localStorage.getItem("wcsm-language") || "en";

function setLanguage(language) {
    currentLanguage = language;
    localStorage.setItem("wcsm-language", language);
    document.documentElement.lang = language;

    document.querySelectorAll("[data-en]").forEach(element => {
        element.textContent = element.dataset[language];
    });

    languageButton.textContent =
        language === "en" ? "🇵🇱 Polski" : "🇬🇧 English";
}

languageButton.addEventListener("click", () => {
    setLanguage(currentLanguage === "en" ? "pl" : "en");
});

setLanguage(currentLanguage);
</script>
</body>
</html>
